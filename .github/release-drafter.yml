name-template: "$NEXT_MINOR_VERSION"
tag-template: "$NEXT_MINOR_VERSION"
change-template: '- $TITLE #$NUMBER [@$AUTHOR]'

categories:
  - title: "Removals"
    when:
      label: "Removal"
  - title: "Deprecations"
    when:
      label: "Deprecation"
  - title: "Documentation"
    when:
      label: "Documentation"
  - title: "Dependencies"
    when:
      label: "Dependency"
  - title: "Testing"
    when:
      label: "Testing"
  - title: "Type hints"
    when:
      label: "Type hints"
  - title: "Other changes"
  - type: "pre-exclude"
    when:
      label: "changelog: skip"

template: |

  https://pillow.readthedocs.io/en/stable/releasenotes/$NEXT_MINOR_VERSION.html

  $CHANGES
